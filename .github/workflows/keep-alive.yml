name: Supabase keep-alive

# Supabase pauses free projects after 7 days without activity; one light query a week keeps
# it awake. Needs the repository secret DATABASE_URL (the Postgres connection string).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not set"; exit 1; }
          # psql is preinstalled on ubuntu-latest
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from (select 1 from chunks limit 1) t"
